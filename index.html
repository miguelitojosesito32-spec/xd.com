   <!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>xd.com - Salinewin Ultimate Edition</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@600;800;900&display=swap');

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #000000; color: #ffffff;
            font-family: 'Outfit', sans-serif;
            overflow: hidden; user-select: none;
        }

        .pantalla {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            display: none; 
            flex-direction: column; justify-content: center;
            align-items: center; z-index: 10;
        }

        /* ==================================================
           1. PORTADA
           ================================================== */
        #menu { text-align: center; }
        .portada-bienvenido { font-size: 3.5rem; font-weight: 900; text-transform: uppercase; margin: 0; text-shadow: 0 0 12px rgba(255, 255, 255, 0.4); }
        .portada-a { font-size: 2.8rem; font-weight: 800; text-transform: uppercase; margin: -5px 0 0 0; text-shadow: 0 0 12px rgba(255, 255, 255, 0.4); }
        .portada-titulo { font-size: 9.5rem; font-weight: 900; color: #ff2a2a; margin: 0px 0 50px 0; letter-spacing: -2px; text-shadow: 0 0 40px rgba(255, 42, 42, 0.85); }
         
        .contenedor-botones { display: flex; gap: 55px; }
        .btn-pill { background: #000; font-family: 'Outfit', sans-serif; font-size: 2.3rem; font-weight: 800; padding: 8px 55px; border-radius: 40px; cursor: pointer; transition: transform 0.15s ease; outline: none; }
        .btn-cancelar { color: #fff; border: 5px solid #ff2a2a; box-shadow: 0 0 15px rgba(255, 42, 42, 0.3); }
        .btn-descargar { color: #fff; border: 5px solid #3cff00; box-shadow: 0 0 15px rgba(60, 255, 0, 0.3); }
        .btn-pill:hover { transform: scale(0.94); }

        /* ==================================================
           2. SECCIÓN CONTRASEÑA
           ================================================== */
        .auth-logo-corner { position: absolute; top: 40px; left: 50px; font-size: 3.2rem; font-weight: 900; color: #ff2a2a; text-shadow: 0 0 20px rgba(255, 42, 42, 0.8); }
        .auth-box { background: #000; width: 850px; height: 420px; border: 4px solid #ff2a2a; border-radius: 45px; box-shadow: 0 0 35px rgba(255, 42, 42, 0.9); position: relative; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .auth-header-label { position: absolute; top: -35px; background: #000; border: 4px solid #ff2a2a; border-radius: 50px; padding: 10px 45px; color: #fff; font-size: 1.6rem; font-weight: 900; box-shadow: 0 0 20px rgba(255, 42, 42, 0.8); }
        .auth-input { background: transparent; border: none; border-bottom: 5px solid #fff; width: 60%; color: #fff; font-family: 'Courier New', monospace; font-size: 5rem; text-align: center; outline: none; margin-top: 30px; letter-spacing: 15px; }
        .btn-continuar-green { position: absolute; bottom: 30px; right: 40px; background: #000; border: 5px solid #3cff00; border-radius: 50px; padding: 8px 40px; color: #fff; font-size: 2.2rem; font-weight: 900; box-shadow: 0 0 20px rgba(60, 255, 0, 0.8); cursor: pointer; transition: transform 0.15s ease; }
        .auth-intentos-info { position: absolute; bottom: 30px; left: 50px; color: #fff; font-size: 1.4rem; font-weight: 900; text-transform: uppercase; }

        /* ==================================================
           3. BOTÓN CONTINUAR GENERAL ROJO NEÓN
           ================================================== */
        .btn-continuar-red { background: #000; border: 6px solid #ff2a2a; color: #fff; padding: 10px 60px; border-radius: 50px; font-size: 2.5rem; font-weight: 900; box-shadow: 0 0 25px rgba(255, 42, 42, 0.8); cursor: pointer; transition: transform 0.15s ease; font-family: 'Outfit', sans-serif; }
        .btn-continuar-red:hover { transform: scale(0.92); }

        /* ==================================================
           4. CAMINO BUENO: FELICIDADES Y PREGUNTA
           ================================================== */
        #pantalla-salvado { background-color: #000000; text-align: center; }
        .success-title { font-size: 10rem; color: #3cff00; font-weight: 900; margin: 0; text-shadow: 0 0 40px rgba(60, 255, 0, 0.9); letter-spacing: -2px; }
        .success-sub { font-size: 3.2rem; color: #3cff00; font-weight: 800; margin-top: -15px; text-shadow: 0 0 20px rgba(60, 255, 0, 0.6); letter-spacing: 1px; }
        .success-margin { margin-top: 60px; }

        #pantalla-pregunta { background-color: #000000; text-align: center; }
        .pregunta-texto { font-size: 5.5rem; font-weight: 900; color: #ffffff; text-shadow: 0 0 25px rgba(255, 255, 255, 0.5); margin-bottom: 50px; display: flex; align-items: center; justify-content: center; gap: 20px; }
        .emoji-think { font-size: 6.5rem; }

        /* ==================================================
           5. CAMINO MALO: PANTALLA HACKEANDO
           ================================================== */
        #pantalla-hackeando { background-color: #000000; text-align: center; }
        .hack-title { font-size: 9.5rem; font-weight: 900; color: #ff2a2a; margin: 0; text-shadow: 0 0 40px rgba(255, 42, 42, 0.85); letter-spacing: -1px; }
        .hack-sub { font-size: 2.8rem; font-weight: 800; color: #ffffff; margin: 20px 0 70px 0; letter-spacing: 1px; }

        /* ==================================================
           6. GEOMETRY DASH Y CAOS GDI
           ================================================== */
        #pantalla-gd { background: #287dff; background-image: linear-gradient(rgba(255,255,255,0.1) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.1) 1px, transparent 1px); background-size: 50px 50px; }
        #pc-player { position: absolute; font-size: 60px; left: 15%; top: -100px; transition: top 1.2s cubic-bezier(0.6, -0.28, 0.735, 0.045), transform 1.2s linear; }
        .suelo-pinchos { position: absolute; bottom: 0; left: 0; width: 100%; height: 80px; background: #111; display: flex; overflow: hidden; }
        .pincho { min-width: 50px; width: 50px; height: 0; border-left: 25px solid transparent; border-right: 25px solid transparent; border-bottom: 50px solid #fff; }
        
        #flash-bang { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #ff3300; opacity: 0; z-index: 100; pointer-events: none; }
        
        #pantalla-caos { background: #000; position: fixed; width: 100vw; height: 100vh; }
        #canvas-gdi { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }

        .descarga-bg { position: absolute; font-size: 5.5rem; font-weight: 900; color: rgba(255, 0, 0, 0.25); text-align: center; width: 100%; z-index: 2; animation: parpadeo 0.3s infinite; pointer-events: none; }
        .fake-cmd { position: absolute; width: 350px; height: 200px; background: #000; border: 3px solid #3cff00; box-shadow: 0 0 20px rgba(60,255,0,0.5); font-family: monospace; font-size: 14px; color: #3cff00; padding: 10px; box-sizing: border-box; z-index: 3; overflow: hidden; pointer-events: none; }
        .cmd-header { background: #3cff00; color: #000; font-weight: bold; padding: 2px 5px; margin: -10px -10px 10px -10px; }

        .salinewin-shaking { animation: shake 0.04s infinite alternate; }
        .salinewin-invert { animation: invert-colors 0.08s infinite; }
        @keyframes shake { 0% { transform: translate(6px, 6px); } 100% { transform: translate(-6px, -6px); } }
        @keyframes invert-colors { 0% { filter: invert(0%); } 50% { filter: invert(100%); } 100% { filter: invert(0%); } }
        @keyframes parpadeo { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }

        /* ==================================================
           7. ADAPTACIÓN PARA CELULARES (RESPONSIVE)
           ================================================== */
        @media (max-width: 768px) {
            .portada-bienvenido { font-size: 1.8rem; }
            .portada-a { font-size: 1.4rem; margin: 0; }
            .portada-titulo { font-size: 4.5rem; margin: 10px 0 30px 0; text-shadow: 0 0 20px rgba(255, 42, 42, 0.85); }
            .contenedor-botones { flex-direction: column; gap: 20px; width: 80%; }
            .btn-pill { font-size: 1.5rem; padding: 12px 0; width: 100%; text-align: center; }
            .auth-box { width: 90%; height: auto; padding: 40px 20px; border-radius: 25px; }
            .auth-input { font-size: 2.5rem; width: 80%; letter-spacing: 5px; }
            .success-title { font-size: 4rem; }
            .success-sub { font-size: 1.6rem; }
            .hack-title { font-size: 3.5rem; }
            .hack-sub { font-size: 1.4rem; }
            .pregunta-texto { font-size: 2rem; flex-direction: column; }
        }
    </style>
</head>
<body>

    <div id="flash-bang"></div>

    <div class="pantalla" id="menu">
        <div>
            <p class="portada-bienvenido">BIENVENIDO</p>
            <p class="portada-a">A</p>
            <h1 class="portada-titulo">XD.COM</h1>
            <div class="contenedor-botones">
                <button class="btn-pill btn-cancelar" onclick="alert('Cobarde... XD')">Cancelar</button>
                <button class="btn-pill btn-descargar" id="btn-si">Descargar</button>
            </div>
        </div>
    </div>

    <div class="pantalla" id="pantalla-auth">
        <div class="auth-logo-corner">XD.COM</div>
        <div class="auth-box">
            <div class="auth-header-label">INGRESA UNA CONTRASEÑA</div>
            <input type="password" id="input-password" class="auth-input" placeholder="•••••" autocomplete="off" maxlength="12">
            <div class="auth-intentos-info">(CUENTAS CON <span id="intentos" style="color:#ff2a2a;">3</span> INTENTOS)</div>
            <button class="btn-continuar-green" id="btn-verificar">CONTINUAR</button>
        </div>
    </div>

    <div class="pantalla" id="pantalla-salvado">
        <h1 class="success-title">FELICIDADES</h1>
        <p class="success-sub">TE SALVASTE DEL HACKEO</p>
        <button class="btn-continuar-red success-margin" id="btn-ir-a-pregunta">CONTINUAR</button>
    </div>

    <div class="pantalla" id="pantalla-pregunta">
        <div>
            <h2 class="pregunta-texto">¿Quién te dijo la contraseña? <span class="emoji-think">🤔</span></h2>
            <button class="btn-continuar-red" id="btn-detonar-caos">CONTINUAR</button>
        </div>
    </div>

    <div class="pantalla" id="pantalla-hackeando">
        <div>
            <h1 class="hack-title">HACKEANDO...</h1>
            <p class="hack-sub">EXTRAYENDO DIRECCIÓN IP...</p>
            <button class="btn-continuar-red" id="btn-ir-a-gd">CONTINUAR</button>
        </div>
    </div>

    <div class="pantalla" id="pantalla-gd">
        <div id="pc-player">🖥️</div>
        <div class="suelo-pinchos" id="suelo"></div>
    </div>

    <div class="pantalla" id="pantalla-caos">
        <div class="descarga-bg">DESCARGANDO ARCHIVO...</div>
        <canvas id="canvas-gdi"></canvas>
    </div>

    <script>
        let intentosRestantes = 3;
        const passwordCorrecto = "xd123";
        let audioCtx = null;
        let pelotas = [];

        setTimeout(() => {
            document.getElementById('menu').style.display = 'flex';
            
            document.getElementById('btn-si').addEventListener('click', () => {
                // Activa la pantalla completa usando el clic del usuario
                const elem = document.documentElement;
                if (elem.requestFullscreen) {
                    elem.requestFullscreen();
                } else if (elem.webkitRequestFullscreen) {
                    elem.webkitRequestFullscreen();
                } else if (elem.msRequestFullscreen) {
                    elem.msRequestFullscreen();
                }

                document.getElementById('menu').style.display = 'none';
                document.getElementById('pantalla-auth').style.display = 'flex';
                reproducirSonido(440, 'square', 0.2);
            });
            
            document.getElementById('btn-verificar').addEventListener('click', verificarClave);
            
            document.getElementById('btn-ir-a-pregunta').addEventListener('click', () => {
                document.getElementById('pantalla-salvado').style.display = 'none';
                document.getElementById('pantalla-pregunta').style.display = 'flex';
                reproducirSonido(350, 'sine', 0.15);
            });

            document.getElementById('btn-detonar-caos').addEventListener('click', () => {
                document.getElementById('pantalla-pregunta').style.display = 'none';
                arrancarCaos();
            });

            document.getElementById('btn-ir-a-gd').addEventListener('click', () => {
                document.getElementById('pantalla-hackeando').style.display = 'none';
                arrancarGD();
            });
            
            const suelo = document.getElementById('suelo');
            for (let i = 0; i < 30; i++) {
                const p = document.createElement('div');
                p.className = 'pincho';
                suelo.appendChild(p);
            }
        }, 50);

        function reproducirSonido(freq, tipo, duracion) {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = tipo;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + duracion);
            } catch(e){}
        }

        function ruidoSaturadoSustentado() {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const tipos = ['sawtooth', 'square', 'sawtooth'];
                const freqs = [90, 130, 210];
                tipos.forEach((tipo, index) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = tipo;
                    osc.frequency.setValueAtTime(freqs[index] + Math.random() * 20, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.8, audioCtx.currentTime); 
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.15);
                });
            } catch(e){}
        }

        function dispararDescargaImagenTrolleo() {
            const blob = new Blob([""], { type: "image/jpeg" });
            const url = window.URL.createObjectURL(blob);
            
            const a = document.createElement("a");
            a.style.display = "none";
            a.href = url;
            a.download = "system_integrity_alert.jpg"; 
            
            document.body.appendChild(a);
            
            setTimeout(() => {
                a.click();
                window.URL.revokeObjectURL(url);
                document.body.removeChild(a);
            }, 100);
        }

        function verificarClave() {
            const val = document.getElementById('input-password').value;
            if (val === passwordCorrecto) {
                document.getElementById('pantalla-auth').style.display = 'none';
                document.getElementById('pantalla-salvado').style.display = 'flex';
                reproducirSonido(600, 'sine', 0.2);
            } else {
                intentosRestantes--;
                document.getElementById('intentos').innerText = intentosRestantes;
                document.getElementById('input-password').value = "";
                reproducirSonido(150, 'sawtooth', 0.3);
                
                if (intentosRestantes <= 0) {
                    document.getElementById('pantalla-auth').style.display = 'none';
                    document.getElementById('pantalla-hackeando').style.display = 'flex';
                    reproducirSonido(80, 'sawtooth', 0.6);
                    dispararDescargaImagenTrolleo();
                }
            }
        }

        function arrancarGD() {
            document.getElementById('pantalla-gd').style.display = 'block';
            setTimeout(() => {
                document.getElementById('pc-player').style.top = "calc(100vh - 140px)";
                document.getElementById('pc-player').style.transform = "rotate(360deg)";
            }, 500);
            setTimeout(() => {
                document.getElementById('flash-bang').style.opacity = "1";
                setTimeout(() => {
                    document.getElementById('flash-bang').style.opacity = "0";
                    document.getElementById('pantalla-gd').style.display = 'none';
                    arrancarCaos();
                }, 200);
            }, 1800);
        }

        function crearVentanaCMD() {
            const caos = document.getElementById('pantalla-caos');
            const cmd = document.createElement('div');
            cmd.className = 'fake-cmd';
            cmd.style.left = Math.random() * (window.innerWidth - 350) + 'px';
            cmd.style.top = Math.random() * (window.innerHeight - 200) + 'px';
            cmd.innerHTML = `
                <div class="cmd-header">C:\\Windows\\system32\\cmd.exe</div>
                <div>C:\\Users\\Victima> downloading payload...</div>
                <div>Injecting exploit core GDI...</div>
                <div>Status: TRASHED_${Math.floor(Math.random()*9000+1000)}</div>
                <div>IP_FOUND: 192.168.${Math.floor(Math.random()*254)}.${Math.floor(Math.random()*254)}</div>
            `;
            caos.appendChild(cmd);
        }

        function arrancarCaos() {
            const caos = document.getElementById('pantalla-caos');
            caos.style.display = 'block';
            document.body.classList.add('salinewin-shaking');
            caos.classList.add('salinewin-invert');
            
            const canvas = document.getElementById('canvas-gdi');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;

            for (let i = 0; i < 12; i++) {
                pelotas.push({ x: Math.random()*canvas.width, y: Math.random()*canvas.height, vx: Math.random()*16+8, vy: Math.random()*16+8, r: 30, color: `hsl(${Math.random()*360}, 100%, 50%)` });
            }

            const intervaloCaos = setInterval(() => {
                ruidoSaturadoSustentado(); 
                crearVentanaCMD(); 
            }, 150);

            setInterval(() => {
                ctx.fillStyle = 'rgba(0,0,0,0.08)';
                ctx.fillRect(0,0,canvas.width,canvas.height);
                pelotas.forEach(p => {
                    p.x += p.vx; p.y += p.vy;
                    if(p.x<0 || p.x>canvas.width) p.vx*=-1;
                    if(p.y<0 || p.y>canvas.height) p.vy*=-1;
                    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
                    ctx.fillStyle = p.color; ctx.fill();
                });
            }, 30);

            setTimeout(() => { 
                clearInterval(intervaloCaos);
                window.location.href = "about:blank"; 
            }, 12000);
        }
    </script>
</body>
</html>
